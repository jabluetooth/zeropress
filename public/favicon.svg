<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Circular background -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>

  <!-- Subtle outer ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#2a2a2a" stroke-width="1"/>

  <!-- The "0" — refined geometric zero -->
  <ellipse cx="256" cy="256" rx="88" ry="120" fill="none" stroke="url(#accentGrad)" stroke-width="18" stroke-linecap="round"/>

  <!-- Diagonal slash through the zero -->
  <line x1="206" y1="336" x2="306" y2="176" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round"/>
</svg>
